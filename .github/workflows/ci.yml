name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # The live provider job runs only when started by hand (TEST-01).
  workflow_dispatch:
    inputs:
      live:
        description: 'Also run the tests that call a real LLM provider (uses the repository secrets)'
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here. package.json's "packageManager" field is the single
      # source of truth; pnpm/action-setup@v4 refuses to run when both are set
      # ("Multiple versions of pnpm specified"), which failed CI run 36520392513.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Runs every test that does not need Windows, Redis, a Python virtualenv,
      # or a reachable LLM API. Those are reported as skipped with the reason,
      # so a genuine regression is the only thing that turns this red.
      - name: Test (platform-independent subset)
        run: pnpm test -- --ci

      # Line coverage of the same run (TEST-01). c8 follows every test's child
      # process through NODE_V8_COVERAGE; the report is kept as an artifact.
      - name: Coverage
        if: always()
        run: npx --yes c8@10.1.3 --reporter=text-summary --reporter=lcov --exclude=tests/** --exclude=node_modules/** --exclude=dist/** node node_modules/tsx/dist/cli.mjs tests/runAll.ts --ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # The same suite on Windows (TEST-01): the PowerShell, window and process
  # tests run there instead of being skipped. Windows behaviour was only ever
  # checked on the owner's PC.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test (Windows)
        run: pnpm test -- --ci

  # Opt-in: tests that call a real LLM provider. Started by hand with
  # live = true; skipped (with the reason) when the secret is not set.
  live-providers:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    env:
      JARVIS_LIVE_TESTS: '1'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Live provider tests
        run: pnpm test -- --ci --filter=finalIntegrationSuite && pnpm test -- --ci --filter=successfulExecutionLifecycleAudit

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # sentence-transformers is deliberately not installed: it pulls in torch,
      # and the vector-persistence test stubs the embedding model.
      - name: Install light Python dependencies
        run: python -m pip install --quiet numpy fastapi pydantic

      - name: Compile-check every Python file
        run: python -m compileall -q memory voice vision bridge

      - name: Vector persistence and fact-id tests
        run: python tests/python/test_vector_persistence.py

      - name: Vector service startup and write-queue tests
        run: python tests/python/test_vector_service_startup.py

      - name: Vector service refuses callers without the token (SEC-18)
        run: python tests/python/test_vector_access.py

      - name: TTS synthesis retry tells JARVIS it needs more time
        run: python tests/python/test_tts_retry_delay.py
